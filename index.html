<!DOCTYPE html>
<html>
<head>
  <title>VCU Schedule Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #F7F7F7;
      padding: 20px;
      color: #231F20;
    }
    h1 {
      color: #F0B323;
      text-align: center;
    }
    .input-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      justify-content: center;
    }
    input, button {
      padding: 10px;
      font-size: 1em;
    }
    .card {
      border: 2px solid #F0B323;
      border-radius: 10px;
      padding: 15px;
      background: #fff;
      flex: 1 1 300px;
      box-sizing: border-box;
    }
    .card strong {
      display: block;
      font-size: 1.1em;
      margin-bottom: 5px;
      color: #00558C;
    }
    .card .activity-text {
      font-size: 1.0em;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .card .location-text {
      font-size: 0.8em;
      font-style: italic;
      color: #444;
    }
    #vcu-logo {
      display: block;
      margin: 0 auto 20px;
      max-width: 150px;
    }
    .dropdown-label {
      cursor: pointer;
      font-weight: bold;
      padding: 10px;
      background-color: #F0B323;
      color: #fff;
      border-radius: 8px;
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-content {
      display: none;
      padding: 10px;
    }
    .arrow {
      display: inline-block;
      transition: transform 0.2s;
    }
    #masterPasswordContainer, #masterSearchContainer, #exitAdminBtn {
      display: none;
      text-align: center;
      margin-bottom: 10px;
    }
    .user-section, .group-section {
      margin-bottom: 10px;
    }
    .section-header {
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      margin-top: 40px;
      color: #00558C;
    }
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
  </style>
</head>
<body>
  <img src="https://cumulusassociation.org/wp-content/uploads/2021/10/VCU-Logo-Seal-Virginia-Commonwealth-University1.png" id="vcu-logo" alt="VCU Logo" />
  <h1>Orientation Grids Viewer</h1>

  <div class="input-group">
    <input type="text" id="userId" placeholder="Enter your ID" />
    <button onclick="loadSchedule()">View Schedule</button>
  </div>

  <div class="input-group">
    <div class="collapsible-label" onclick="togglePassword()">
      <span id="arrow">▸</span> Show Master Schedule Access
    </div>
  </div>

  <div id="masterPasswordContainer">
    <input type="password" id="masterPassword" placeholder="Enter master password" />
  </div>

  <div id="masterSearchContainer">
    <input type="text" id="masterSearch" placeholder="Search by any keyword..." />
    <button id="masterSearchBtn">Search</button>
  </div>

  <div id="exitAdminBtn">
    <button onclick="exitAdminMode()">Exit Admin Mode</button>
  </div>

  <div id="scheduleContainer"></div>
  <div id="masterSchedule"></div>

<script>
const SHEET_ID = "1Uafwo7ikADBeXOnof6Fq1LSKXVWfP9kJDMWsg2VirWE";
const allTabs = ["6/23-24", "6/26-27", "6/30", "7/7-8", "7/10-11", "7/14-15", "7/17-18", "7/21-22", "7/24", "8/15", "Transfer Session"];
const sessionDateMap = {
  "2025-06-23": "6/23-24", "2025-06-24": "6/23-24",
  "2025-06-25": "6/26-27", "2025-06-26": "6/26-27", "2025-06-27": "6/26-27",
  "2025-06-29": "6/30", "2025-06-30": "6/30",
  "2025-07-07": "7/7-8", "2025-07-08": "7/7-8",
  "2025-07-10": "7/10-11", "2025-07-11": "7/10-11",
  "2025-07-14": "7/14-15", "2025-07-15": "7/14-15",
  "2025-07-17": "7/17-18", "2025-07-18": "7/17-18",
  "2025-07-21": "7/21-22", "2025-07-22": "7/21-22",
  "2025-07-24": "7/24", "2025-08-15": "8/15"
};
const MASTER_PASSWORD = "master123";
let isAdmin = false;

document.getElementById("userId").addEventListener("keydown", e => { if (e.key === "Enter") loadSchedule(); });
document.getElementById("masterPassword").addEventListener("keydown", e => { if (e.key === "Enter") loadSchedule(); });
document.getElementById("masterSearchBtn").addEventListener("click", filterMasterDropdowns);
document.getElementById("masterSearch").addEventListener("keydown", e => { if (e.key === "Enter") filterMasterDropdowns(); });

function togglePassword() {
  const container = document.getElementById("masterPasswordContainer");
  const arrow = document.getElementById("arrow");
  const visible = container.style.display === "block";
  container.style.display = visible ? "none" : "block";
  arrow.textContent = visible ? "▸" : "▾";
}

function exitAdminMode() {
  isAdmin = false;
  document.getElementById("masterSearchContainer").style.display = "none";
  document.getElementById("exitAdminBtn").style.display = "none";
  document.getElementById("masterPassword").value = "";
  document.getElementById("masterSchedule").innerHTML = "";
}

function getTodayDateString() {
  return new Date().toISOString().split("T")[0];
}

function getTodayTabs() {
  const session = sessionDateMap[getTodayDateString()];
  return session ? allTabs.filter(tab => tab === session) : [];
}

function extractLink(text) {
  if (!text) return "";
  const hyperlinkFormulaRegex = /^=HYPERLINK\("([^"]+)","([^"]+)"\)$/i;
  const match = text.match(hyperlinkFormulaRegex);
  if (match) return `<a href="${match[1]}" target="_blank" rel="noopener noreferrer">${match[2]}</a>`;
  if (/^(https?:\/\/)/i.test(text)) return `<a href="${text}" target="_blank" rel="noopener noreferrer">${text}</a>`;
  return text;
}

function filterMasterDropdowns() {
  const term = document.getElementById("masterSearch").value.trim().toLowerCase();
  const userSections = document.querySelectorAll(".user-section");
  userSections.forEach(section => {
    const textContent = section.innerText.toLowerCase();
    section.style.display = textContent.includes(term) ? "" : "none";
  });
  document.querySelectorAll(".group-section").forEach(group => {
    const visible = [...group.querySelectorAll(".user-section")].some(u => u.style.display !== "none");
    group.style.display = visible ? "" : "none";
  });
  document.querySelectorAll(".session-group").forEach(sess => {
    const visible = [...sess.querySelectorAll(".group-section")].some(g => g.style.display !== "none");
    sess.style.display = visible ? "" : "none";
  });
}

function groupByGlobalTags(rows) {
  const grouped = {};
  for (const row of rows) {
    const tag = row.activity.trim().toUpperCase();
    if (!grouped[tag]) grouped[tag] = [];
    grouped[tag].push(row);
  }
  return grouped;
}

function createCardHTML(item) {
  return `
    <div class="card">
      <strong>${item.time}</strong>
      <div class="activity-text">${extractLink(item.activity)}</div>
      <div class="location-text">${extractLink(item.location)}</div>
      <small style="color:gray;">User ID: ${item.id}</small>
    </div>`;
}

async function loadSchedule() {
  const userId = document.getElementById("userId").value.trim().toLowerCase();
  const password = document.getElementById("masterPassword").value.trim();
  const container = document.getElementById("scheduleContainer");
  const masterDiv = document.getElementById("masterSchedule");
  container.innerHTML = "Loading...";
  masterDiv.innerHTML = "";

  const SHEET_TABS = getTodayTabs();
  if (!SHEET_TABS.length) {
    container.innerHTML = "<p style='text-align:center; color:red;'>No session data available for today.</p>";
    return;
  }

  let allRows = [];
  for (const tab of SHEET_TABS) {
    try {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      const rows = json.table.rows.map(r => ({
        id: r.c[0]?.v?.toLowerCase()?.trim() || "",
        time: r.c[1]?.v || "Unknown Time",
        activity: r.c[2]?.f || r.c[2]?.v || "",
        location: r.c[3]?.f || r.c[3]?.v || "",
        tab
      })).filter(r => r.id && r.id !== "hidden" && r.id !== "_blank_");
      allRows = allRows.concat(rows);
    } catch (err) {
      console.error(`Error loading sheet "${tab}":`, err);
    }
  }

  isAdmin = password === MASTER_PASSWORD;
  document.getElementById("masterSearchContainer").style.display = isAdmin ? "block" : "none";
  document.getElementById("exitAdminBtn").style.display = isAdmin ? "block" : "none";

  const allRowsBySuffix = {};
  allRows.forEach(row => {
    if (/^all[1-4]$/.test(row.id)) {
      if (!allRowsBySuffix[row.id]) allRowsBySuffix[row.id] = [];
      allRowsBySuffix[row.id].push(row);
    }
  });

  const mergeWithAllRows = rows => {
    const suffixes = new Set(rows.map(r => r.id.match(/([1-4])$/)?.[1]).filter(Boolean));
    const shared = [...suffixes].flatMap(s => allRowsBySuffix[`all${s}`] || []);
    return [...shared, ...rows];
  };

  if (!isAdmin) {
    let userFiltered = allRows.filter(r => r.id === userId);
    if (!userFiltered.length) {
      container.innerHTML = "<p style='color:red; text-align:center;'>No schedule found for this ID.</p>";
      return;
    }
    const merged = mergeWithAllRows(userFiltered);
    const sharedGrouped = groupByGlobalTags(merged.filter(r => r.id.startsWith("all")));
    const personal = merged.filter(r => !r.id.startsWith("all"));
    container.innerHTML = `<div class="schedule-grid">`
      + Object.values(sharedGrouped).flat().map(createCardHTML).join("")
      + personal.map(createCardHTML).join("")
      + `</div>`;
  } else {
    container.innerHTML = "<p style='text-align:center;'>Admin Mode: Use search above.</p>";
    // your master mode logic here...
  }
}
</script>
</body>
</html>
