<!DOCTYPE html>
<html>
<head>
  <title>VCU Schedule Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #F7F7F7;
      padding: 20px;
      color: #231F20;
    }
    h1 {
      color: #F0B323;
      text-align: center;
    }
    .input-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      justify-content: center;
    }
    input, button {
      padding: 10px;
      font-size: 1em;
    }
    .card {
      border: 2px solid #F0B323;
      border-radius: 10px;
      padding: 15px;
      background: #fff;
      margin-bottom: 10px;
      position: relative;
      transition: background-color 0.3s, box-shadow 0.3s, border-color 0.3s;
    }
    .card.top-row {
      border-color: #D72631;
      background: #FFE6E8;
    }
    .card strong {
      display: block;
      font-size: 1.1em;
      margin-bottom: 5px;
      color: #00558C;
    }
    .card .activity-text {
      font-size: 1.0em;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .card .location-text {
      font-size: 0.8em;
      font-style: italic;
      color: #444;
    }
    .card.yellow-highlight {
      border-color: #F0B323;
      background-color: #FFF8E1; /* soft yellow */
      box-shadow: 0 0 8px rgba(240, 179, 35, 0.5);
    }
    .card.red-highlight {
      border-color: #D72631;
      background-color: #FFE6E8; /* light red/pink */
      box-shadow: 0 0 8px rgba(215, 38, 49, 0.6);
    }
    .card.red-highlight .now-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #D72631;
      color: #fff;
      font-size: 0.7em;
      padding: 2px 6px;
      border-radius: 5px;
      font-weight: bold;
      user-select: none;
    }
    #vcu-logo {
      display: block;
      margin: 0 auto 20px;
      max-width: 150px;
    }
    .session-group {
      margin-bottom: 40px;
    }
    .session-title {
      font-size: 1.8em;
      font-weight: bold;
      color: #00558C;
      margin-bottom: 15px;
      border-bottom: 2px solid #F0B323;
      padding-bottom: 5px;
    }
    .user-section {
      margin-bottom: 30px;
    }
    .user-title {
      font-weight: bold;
      font-size: 1.3em;
      margin-bottom: 10px;
      color: #231F20;
      border-bottom: 1px solid #ccc;
      padding-bottom: 3px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .arrow {
      transition: transform 0.2s ease;
      font-weight: bold;
    }
    .dropdown-content {
      display: none;
      padding-top: 10px;
    }
    .user-section.expanded .dropdown-content {
      display: block;
    }
    .user-section.expanded .arrow {
      transform: rotate(90deg);
    }
  </style>
</head>
<body>
  <img src="https://cumulusassociation.org/wp-content/uploads/2021/10/VCU-Logo-Seal-Virginia-Commonwealth-University1.png" id="vcu-logo" alt="VCU Logo" />
  <h1>Orientation Grids Viewer</h1>

  <div class="input-group">
    <input type="text" id="userId" placeholder="Enter your ID" />
    <input type="password" id="masterPassword" placeholder="Enter master password (if any)" />
    <button onclick="loadSchedule()">View Schedule</button>
  </div>

  <div id="scheduleContainer"></div>

  <script>
    const SHEET_ID = "1Uafwo7ikADBeXOnof6Fq1LSKXVWfP9kJDMWsg2VirWE";

    const allTabs = ["6/23-24", "6/26-27", "6/30", "7/7-8", "7/10-11", "7/14-15", "7/17-18", "7/21-22", "7/24", "8/15", "Transfer Session"];

    const MASTER_PASSWORD = "master123";

    // Parse time strings to Date objects (today + time)
    function parseTimeString(timeStr) {
      if (!timeStr) return null;
      const now = new Date();
      const todayStr = now.toDateString();
      try {
        return new Date(`${todayStr} ${timeStr.trim()}`);
      } catch {
        return null;
      }
    }

    // Parse event times (start - end) or single time
    function parseEventTimes(timeStr) {
      if (!timeStr) return null;
      const parts = timeStr.split("-");
      if (parts.length === 2) {
        const start = parseTimeString(parts[0]);
        const end = parseTimeString(parts[1]);
        if (start && end) return { start, end };
      } else if (parts.length === 1) {
        const start = parseTimeString(parts[0]);
        if (start) return { start, end: null };
      }
      return null;
    }

    // Highlight logic: yellow 5 min before, red during event (until next event)
    function getHighlightClass(event, nextEvent) {
      const now = new Date();
      const FIVE_MINUTES = 5 * 60 * 1000;

      if (!event.times) return "";

      const yellowStart = new Date(event.times.start.getTime() - FIVE_MINUTES);
      const start = event.times.start;
      const end = event.times.end;

      let redEnd = null;
      if (end) {
        redEnd = end;
      } else if (nextEvent && nextEvent.times) {
        redEnd = nextEvent.times.start;
      }

      if (now >= yellowStart && now < start) {
        return "yellow-highlight";
      }
      if (now >= start) {
        if (!redEnd || now < redEnd) {
          return "red-highlight";
        }
      }
      return "";
    }

    function extractLink(text) {
      if (!text) return "";
      const hyperlinkFormulaRegex = /^=HYPERLINK\("([^"]+)","([^"]+)"\)$/i;
      const match = text.match(hyperlinkFormulaRegex);
      if (match) return `<a href="${match[1]}" target="_blank" rel="noopener noreferrer">${match[2]}</a>`;
      if (/^(https?:\/\/)/i.test(text)) return `<a href="${text}" target="_blank" rel="noopener noreferrer">${text}</a>`;
      return text;
    }

    function createCardHTML(item, highlightClass) {
      const globalTags = ["TOP", "ANNOUNCEMENT"];
      const isPinned = globalTags.includes(item.activity.trim().toUpperCase());

      return `
        <div class="card ${isPinned ? "top-row" : ""} ${highlightClass}">
          ${highlightClass === "red-highlight" ? '<div class="now-badge">Happening now</div>' : ""}
          <strong>${item.time}</strong>
          <div class="activity-text">${extractLink(item.activity)}</div>
          <div class="location-text">${extractLink(item.location)}</div>
          <small style="color:gray;">User ID: ${item.id}</small>
        </div>`;
    }

    // Render user schedule fully expanded (no dropdown)
    function renderUserSchedule(userId, rows) {
      const globalTags = ["TOP", "ANNOUNCEMENT"];
      const pinnedRows = rows.filter(r => globalTags.includes(r.activity.trim().toUpperCase()));
      const normalRows = rows.filter(r => !globalTags.includes(r.activity.trim().toUpperCase()));

      normalRows.forEach(r => r.times = parseEventTimes(r.time));
      normalRows.sort((a,b) => {
        if (!a.times || !b.times) return 0;
        return a.times.start - b.times.start;
      });

      const pinnedHTML = pinnedRows.map(r => createCardHTML(r, "")).join("");
      const normalHTML = normalRows.map((r, i) => {
        const next = normalRows[i+1];
        const highlightClass = getHighlightClass(r, next);
        return createCardHTML(r, highlightClass);
      }).join("");

      return `
        <div class="user-section">
          <div class="user-title">${userId.toUpperCase()}</div>
          ${pinnedHTML}
          ${normalHTML}
        </div>
      `;
    }

    // Render user schedule with dropdown (for admin)
    function renderUserDropdown(userId, rows) {
      const globalTags = ["TOP", "ANNOUNCEMENT"];
      const pinnedRows = rows.filter(r => globalTags.includes(r.activity.trim().toUpperCase()));
      const normalRows = rows.filter(r => !globalTags.includes(r.activity.trim().toUpperCase()));

      normalRows.forEach(r => r.times = parseEventTimes(r.time));
      normalRows.sort((a,b) => {
        if (!a.times || !b.times) return 0;
        return a.times.start - b.times.start;
      });

      const pinnedHTML = pinnedRows.map(r => createCardHTML(r, "")).join("");
      const normalHTML = normalRows.map((r, i) => {
        const next = normalRows[i+1];
        const highlightClass = getHighlightClass(r, next);
        return createCardHTML(r, highlightClass);
      }).join("");

      // Build dropdown HTML
      return `
        <div class="user-section">
          <div class="user-title" onclick="toggleDropdown(this)">
            ${userId.toUpperCase()} <span class="arrow">▸</span>
          </div>
          <div class="dropdown-content">
            ${pinnedHTML}
            ${normalHTML}
          </div>
        </div>
      `;
    }

    function toggleDropdown(element) {
      const userSection = element.parentElement;
      userSection.classList.toggle("expanded");
    }

    // Render master schedule grouped by tabs with user dropdowns
    function renderMasterSchedule(groupedByUser, allRows) {
      // Unique tabs sorted
      const tabsSet = new Set(allRows.map(r => r.tab));
      const tabs = Array.from(tabsSet).sort();

      let html = "";

      tabs.forEach(tab => {
        html += `<div class="session-group"><div class="session-title">${tab}</div>`;

        // Users with rows in this tab
        const usersInTab = Object.keys(groupedByUser).filter(uid =>
          groupedByUser[uid].some(r => r.tab === tab)
        ).sort();

        usersInTab.forEach(uid => {
          const userRowsForTab = groupedByUser[uid].filter(r => r.tab === tab);
          html += renderUserDropdown(uid, userRowsForTab);
        });

        html += "</div>";
      });

      return html;
    }

    async function loadSchedule() {
      const userIdInput = document.getElementById("userId").value.trim().toLowerCase();
      const password = document.getElementById("masterPassword").value.trim();
      const container = document.getElementById("scheduleContainer");
      container.innerHTML = "Loading...";

      // Load all tabs (you can adjust to limit tabs)
      const tabsToLoad = allTabs;

      let allRows = [];
      for (const tab of tabsToLoad) {
        try {
          const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`;
          const res = await fetch(url);
          const text = await res.text();
          const json = JSON.parse(text.substring(47).slice(0, -2));
          const rows = json.table.rows.map(r => ({
            id: (r.c[0]?.f || r.c[0]?.v || "").toLowerCase().trim(),
            time: r.c[1]?.v || "Unknown Time",
            activity: r.c[2]?.f || r.c[2]?.v || "",
            location: r.c[3]?.f || r.c[3]?.v || "",
            tab
          })).filter(r => r.id && r.id !== "hidden" && r.id !== "_blank_");
          allRows = allRows.concat(rows);
        } catch (err) {
          console.error(`Error loading sheet "${tab}":`, err);
        }
      }

      const isAdmin = password === MASTER_PASSWORD;

      const globalPinnedTags = ["TOP", "ANNOUNCEMENT"];
      const globalPinnedRows = allRows.filter(r => globalPinnedTags.includes(r.activity.trim().toUpperCase()));

      const groupedByUser = {};
      allRows.forEach(r => {
        if (globalPinnedTags.includes(r.activity.trim().toUpperCase())) return;
        if (!groupedByUser[r.id]) groupedByUser[r.id] = [];
        groupedByUser[r.id].push(r);
      });

      if (isAdmin) {
        // Admin mode: show all users grouped by tab, with dropdowns
        container.innerHTML = renderMasterSchedule(groupedByUser, allRows);

        // Add event listeners for dropdown toggles (for keyboard/mouse)
        document.querySelectorAll(".user-title").forEach(el => {
          el.onclick = () => toggleDropdown(el);
        });
      } else {
        // User mode: show only that user's schedule fully expanded, no dropdown
        if (!userIdInput) {
          container.innerHTML = "<p style='text-align:center; color:red;'>Please enter your User ID.</p>";
          return;
        }
        const matchedKeys = Object.keys(groupedByUser).filter(k => k.includes(userIdInput));
        if (matchedKeys.length === 0) {
          container.innerHTML = `<p style='text-align:center; color:red;'>No schedule found for user ID: ${userIdInput}</p>`;
          return;
        }
        const userKey = matchedKeys[0];
        container.innerHTML = renderUserSchedule(userKey, groupedByUser[userKey]);
      }
    }
  </script>
</body>
</html>
