<!DOCTYPE html>
<html>
<head>
  <title>VCU Schedule Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #F7F7F7;
      padding: 20px;
      color: #231F20;
    }
    h1 {
      color: #F0B323;
      text-align: center;
    }
    .input-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      justify-content: center;
    }
    input, button {
      padding: 10px;
      font-size: 1em;
    }
    .card {
      border: 2px solid #F0B323;
      border-radius: 10px;
      padding: 15px;
      background: #fff;
      flex: 1 1 300px;
      box-sizing: border-box;
    }
    .card strong {
      display: block;
      font-size: 1.1em;
      margin-bottom: 5px;
      color: #00558C;
    }
    #vcu-logo {
      display: block;
      margin: 0 auto 20px;
      max-width: 150px;
    }
    .dropdown-label {
      cursor: pointer;
      font-weight: bold;
      padding: 10px;
      background-color: #F0B323;
      color: #fff;
      border-radius: 8px;
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-content {
      display: none;
      padding: 10px;
    }
    .arrow {
      display: inline-block;
      transition: transform 0.2s;
    }
    .section-header {
      font-size: 1.4em;
      font-weight: bold;
      margin-top: 40px;
      color: #00558C;
      text-align: center;
    }
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
    .user-section {
      margin-bottom: 10px;
    }
    #masterPasswordContainer, #masterSearchContainer, #exitAdminBtn {
      display: none;
      text-align: center;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <img src="https://cumulusassociation.org/wp-content/uploads/2021/10/VCU-Logo-Seal-Virginia-Commonwealth-University1.png" id="vcu-logo" alt="VCU Logo" />
  <h1>Orientation Grids Viewer</h1>

  <div class="input-group">
    <input type="text" id="userId" placeholder="Enter your ID" />
    <button onclick="loadSchedule()">View Schedule</button>
  </div>

  <div class="input-group">
    <div class="collapsible-label" onclick="togglePassword()">
      <span id="arrow">▸</span> Show Master Schedule Access
    </div>
  </div>

  <div id="masterPasswordContainer">
    <input type="password" id="masterPassword" placeholder="Enter master password" />
  </div>

  <div id="masterSearchContainer">
    <input type="text" id="masterSearch" placeholder="Search by user name or keyword...">
    <button id="masterSearchBtn">Search</button>
  </div>

  <div id="exitAdminBtn">
    <button onclick="exitAdminMode()">Exit Admin Mode</button>
  </div>

  <div id="scheduleContainer"></div>
  <div id="masterSchedule"></div>

<script>
  const SHEET_ID = "1Uafwo7ikADBeXOnof6Fq1LSKXVWfP9kJDMWsg2VirWE";
  const allTabs = [
    "6/23-24", "6/26-27", "6/30", "7/7-8", "7/10-11", "7/14-15", "7/17-18", "7/21-22", "7/24", "8/15", "Transfer Session"
  ];

  const sessionDateMap = {
    "2025-06-25": "6/26-27",
    "2025-06-26": "6/26-27",
    "2025-06-27": "6/26-27",
    // add more date mappings here
  };

  const MASTER_PASSWORD = "master123";
  let isAdmin = false;

  function getTodayDateString() {
    return new Date().toISOString().split("T")[0];
  }

  function getTodayTabs() {
    const session = sessionDateMap[getTodayDateString()];
    return session ? allTabs.filter(tab => tab.includes(session)) : [];
  }

  function togglePassword() {
    const container = document.getElementById("masterPasswordContainer");
    const arrow = document.getElementById("arrow");
    const visible = container.style.display === "block";
    container.style.display = visible ? "none" : "block";
    arrow.textContent = visible ? "▸" : "▾";
  }

  function exitAdminMode() {
    isAdmin = false;
    document.getElementById("masterSearchContainer").style.display = "none";
    document.getElementById("exitAdminBtn").style.display = "none";
    document.getElementById("masterPassword").value = "";
    document.getElementById("masterSchedule").innerHTML = "";
  }

  document.getElementById("userId").addEventListener("keydown", e => {
    if (e.key === "Enter") loadSchedule();
  });
  document.getElementById("masterPassword").addEventListener("keydown", e => {
    if (e.key === "Enter") loadSchedule();
  });
  document.getElementById("masterSearchBtn").addEventListener("click", filterMasterDropdowns);
  document.getElementById("masterSearch").addEventListener("keydown", e => {
    if (e.key === "Enter") filterMasterDropdowns();
  });

  function filterMasterDropdowns() {
    const term = document.getElementById("masterSearch").value.trim().toLowerCase();
    const sections = document.querySelectorAll(".user-section, .session-section");
    sections.forEach(section => {
      const content = section.innerText.toLowerCase();
      section.style.display = content.includes(term) ? "" : "none";
    });
  }

  async function loadSchedule() {
    const userId = document.getElementById("userId").value.trim().toLowerCase();
    const password = document.getElementById("masterPassword").value.trim();
    const container = document.getElementById("scheduleContainer");
    const masterDiv = document.getElementById("masterSchedule");
    container.innerHTML = "Loading...";
    masterDiv.innerHTML = "";

    const SHEET_TABS = getTodayTabs();
    if (!SHEET_TABS.length) {
      container.innerHTML = "<p style='text-align:center; color:red;'>No session data available for today.</p>";
      return;
    }

    isAdmin = password === MASTER_PASSWORD;
    document.getElementById("masterSearchContainer").style.display = isAdmin ? "block" : "none";
    document.getElementById("exitAdminBtn").style.display = isAdmin ? "block" : "none";

    if (!isAdmin) {
      // User mode: only today's session
      const tab = SHEET_TABS[0];
      const data = await fetchTabData(tab);
      const userRows = data.filter(r => r.id === userId);
      if (!userRows.length) {
        container.innerHTML = "<p style='color:red; text-align:center;'>No schedule found for this ID.</p>";
        return;
      }
      container.innerHTML = `<div class="schedule-grid">${userRows.map(toCard).join("")}</div>`;
    } else {
      container.innerHTML = "";
      for (const tab of allTabs) {
        const data = await fetchTabData(tab);
        if (!data.length) continue;

        const sessionSection = document.createElement("div");
        sessionSection.className = "session-section";

        const sessionHeader = document.createElement("div");
        sessionHeader.className = "dropdown-label";
        sessionHeader.innerHTML = `<span>${tab}</span> <span class="arrow">▸</span>`;
        const sessionContent = document.createElement("div");
        sessionContent.className = "dropdown-content";
        sessionContent.style.display = "none";

        sessionHeader.addEventListener("click", () => {
          const expanded = sessionContent.style.display === "block";
          sessionContent.style.display = expanded ? "none" : "block";
          sessionHeader.querySelector(".arrow").style.transform = expanded ? "rotate(0deg)" : "rotate(90deg)";
        });

        // Group by user ID
        const names = [...new Set(data.map(d => d.id.replace(/[^a-zA-Z]/g, "").toUpperCase()))];
        for (const name of names) {
          const entries = data.filter(d => d.id.replace(/[^a-zA-Z]/g, "").toUpperCase() === name);
          const section = document.createElement("div");
          section.className = "user-section";

          const label = document.createElement("div");
          label.className = "dropdown-label";
          label.innerHTML = `<span>${name}</span> <span class="arrow">▸</span>`;
          const content = document.createElement("div");
          content.className = "dropdown-content schedule-grid";

          content.innerHTML = entries.map(toCard).join("");
          content.style.display = "none";

          label.addEventListener("click", () => {
            const expanded = content.style.display === "block";
            content.style.display = expanded ? "none" : "block";
            label.querySelector(".arrow").style.transform = expanded ? "rotate(0deg)" : "rotate(90deg)";
          });

          section.appendChild(label);
          section.appendChild(content);
          sessionContent.appendChild(section);
        }

        sessionSection.appendChild(sessionHeader);
        sessionSection.appendChild(sessionContent);
        masterDiv.appendChild(sessionSection);
      }
    }
  }

  async function fetchTabData(tab) {
    try {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      const rows = json.table.rows;
      return rows.map(r => ({
        id: r.c[0]?.v?.toLowerCase()?.trim() || "",
        time: r.c[1]?.v || "Unknown Time",
        activity: r.c[2]?.v || "",
        location: r.c[3]?.v || ""
      })).filter(r => r.id && r.id !== "hidden" && r.id !== "_blank_");
    } catch (err) {
      console.error(`Error loading sheet "${tab}":`, err);
      return [];
    }
  }

  function toCard(item) {
    return `
      <div class="card">
        <strong>${item.time}</strong>
        ${item.activity}<br />
        <em>${item.location}</em><br />
        <small style="color:gray;">User ID: ${item.id}</small>
      </div>`;
  }
</script>
</body>
</html>
