<!DOCTYPE html>
<html>
<head>
  <title>VCU Schedule Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* [styles same as yours] */
    body { font-family: Arial, background-color:#F7F7F7; padding:20px; color:#231F20; }
    h1 { color:#F0B323; text-align:center; }
    .input-group { display:flex; gap:10px; margin-bottom:20px; justify-content:center; flex-wrap:wrap; }
    input,button { padding:10px; font-size:1em; }
    .card { border:2px solid #F0B323; border-radius:10px; padding:15px; background:#fff; flex:1 1 300px; box-sizing:border-box; }
    .card strong { font-size:1.1em; margin-bottom:5px; color:#00558C; display:block; }
    .activity-text { font-size:1em; font-weight:bold; margin-bottom:6px; }
    .location-text { font-size:0.8em; font-style:italic; color:#444; }
    #vcu-logo { display:block; margin:0 auto 20px; max-width:150px; }
    .dropdown-label { cursor:pointer; font-weight:bold; padding:10px; background:#F0B323; color:#fff; border-radius:8px; margin:5px 0; display:flex; justify-content:space-between; align-items:center; }
    .dropdown-content { display:none; padding:10px; }
    .arrow { display:inline-block; transition:transform 0.2s; }
    #masterPasswordContainer,#masterSearchContainer,#exitAdminBtn { display:none; text-align:center; margin-bottom:10px; }
    .user-section,.group-section { margin-bottom:10px; }
    .section-header { text-align:center; font-size:1.5em; font-weight:bold; margin-top:40px; color:#00558C; }
    .schedule-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:15px; }
  </style>
</head>
<body>
  <img id="vcu-logo" src="https://cumulusassociation.org/wp-content/uploads/2021/10/VCU-Logo-Seal-Virginia-Commonwealth-University1.png" alt="VCU Logo" />
  <h1>Orientation Grids Viewer</h1>

  <div class="input-group">
    <input id="userId" placeholder="Enter your ID" />
    <button onclick="loadSchedule()">View Schedule</button>
  </div>

  <div class="input-group">
    <div class="collapsible-label" onclick="togglePassword()">
      <span id="arrow">▸</span> Show Master Schedule Access
    </div>
  </div>

  <div id="masterPasswordContainer">
    <input id="masterPassword" type="password" placeholder="Enter master password" />
  </div>

  <div id="masterSearchContainer">
    <input id="masterSearch" placeholder="Search by any keyword..." />
    <button id="masterSearchBtn">Search</button>
  </div>

  <div id="exitAdminBtn">
    <button onclick="exitAdminMode()">Exit Admin Mode</button>
  </div>

  <div id="scheduleContainer"></div>
  <div id="masterSchedule"></div>

<script>
const SHEET_ID = "1Uafwo7ikADBeXOnof6Fq1LSKXVWfP9kJDMWsg2VirWE";
const allTabs = ["6/23-24","6/26-27","6/30","7/7-8","7/10-11","7/14-15","7/17-18","7/21-22","7/24","8/15","Transfer Session"];
const sessionDateMap = {
  "2025-06-23": "6/23-24", "2025-06-24": "6/23-24",
  "2025-06-25": "6/26-27", "2025-06-26": "6/26-27", "2025-06-27": "6/26-27",
  "2025-06-29": "6/30", "2025-06-30": "6/30",
  "2025-07-03": "7/7-8", "2025-07-04": "7/7-8", "2025-07-05": "7/7-8", "2025-07-06": "7/7-8", "2025-07-07": "7/7-8", "2025-07-08": "7/7-8",
  "2025-07-10": "7/10-11", "2025-07-11": "7/10-11",
  "2025-07-14": "7/14-15", "2025-07-15": "7/14-15",
  "2025-07-17": "7/17-18", "2025-07-18": "7/17-18",
  "2025-07-21": "7/21-22", "2025-07-22": "7/21-22",
  "2025-07-24": "7/24", "2025-08-15": "8/15"
};
const MASTER_PASSWORD = "master123";
let isAdmin = false;

document.getElementById("userId").addEventListener("keydown", e=>{ if(e.key==="Enter") loadSchedule(); });
document.getElementById("masterPassword").addEventListener("keydown", e=>{ if(e.key==="Enter") loadSchedule(); });
document.getElementById("masterSearchBtn").addEventListener("click", filterMasterDropdowns);
document.getElementById("masterSearch").addEventListener("keydown", e=>{ if(e.key==="Enter") filterMasterDropdowns(); });

function togglePassword(){
  const c=document.getElementById("masterPasswordContainer");
  const a=document.getElementById("arrow");
  c.style.display = c.style.display==="block"?"none":"block";
  a.textContent = a.textContent==="▸"?"▾":"▸";
}
function exitAdminMode(){
  isAdmin=false;
  document.getElementById("masterSearchContainer").style.display="none";
  document.getElementById("exitAdminBtn").style.display="none";
  document.getElementById("masterPassword").value="";
  document.getElementById("masterSchedule").innerHTML="";
}

function extractLink(text){
  if(!text) return "";
  const h=/^=HYPERLINK\("([^"]+)","([^"]+)"\)$/i.exec(text);
  if(h) return `<a href="${h[1]}" target="_blank">${h[2]}</a>`;
  if(/^(https?:\/\/)/i.test(text)) return `<a href="${text}" target="_blank">${text}</a>`;
  return text;
}

function createCardHTML(item){
  return `<div class="card">
    <strong>${item.time}</strong>
    <div class="activity-text">${extractLink(item.activity)}</div>
    <div class="location-text">${extractLink(item.location)}</div>
    <small style="color:gray;">User ID: ${item.id}</small>
  </div>`;
}

const renderDropdown=(uid,rows)=>{
  const displayName = uid.replace(/\d$/,'');
  return `<div class="user-section">
    <div class="dropdown-label" onclick="this.nextElementSibling.style.display = (this.nextElementSibling.style.display==='block'?'none':'block');">
      ${displayName} <span class="arrow">▾</span>
    </div>
    <div class="dropdown-content">
      <div class="schedule-grid">
        ${rows.map(createCardHTML).join("")}
      </div>
    </div>
  </div>`;
};

function filterMasterDropdowns(){
  const term=document.getElementById("masterSearch").value.toLowerCase();
  document.querySelectorAll(".user-section").forEach(s=>{
    s.style.display = s.innerText.toLowerCase().includes(term)?"":"none";
  });
  document.querySelectorAll(".group-section").forEach(g=>{
    g.style.display = [...g.querySelectorAll(".user-section")].some(u=>u.style.display==="")?"":"none";
  });
  document.querySelectorAll(".session-group").forEach(sg=>{
    sg.style.display = [...sg.querySelectorAll(".group-section")].some(g=>g.style.display==="")?"":"none";
  });
}

async function loadSchedule(){
  const userId=document.getElementById("userId").value.toLowerCase().trim();
  const password=document.getElementById("masterPassword").value;
  const container=document.getElementById("scheduleContainer");
  const masterDiv=document.getElementById("masterSchedule");
  container.innerHTML="Loading...";
  masterDiv.innerHTML="";

  const todayStr=new Date().toISOString().split("T")[0];
  const tab = sessionDateMap[todayStr];
  if(!tab){
    container.innerHTML="<p style='color:red;text-align:center;'>No session data for today.</p>";
    return;
  }

  let allRows=[];
  try{
    const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`);
    const text = await res.text();
    const json = JSON.parse(text.substring(47).slice(0,-2));
    allRows=json.table.rows.map((r,i)=>({
      id: (r.c[0]?.f||r.c[0]?.v||"").toLowerCase().trim(),
      time: r.c[1]?.v||"",
      activity: r.c[2]?.f||r.c[2]?.v||"",
      location: r.c[3]?.f||r.c[3]?.v||"",
      row: i+2
    })).filter(r=>r.id);
  }catch(err){
    console.error(err);
  }

  isAdmin = password===MASTER_PASSWORD;
  document.getElementById("masterSearchContainer").style.display = isAdmin?"block":"none";
  document.getElementById("exitAdminBtn").style.display = isAdmin?"block":"none";

  if(!isAdmin){
    const userRows = allRows.filter(r=>r.id===userId);
    if(!userRows.length){
      container.innerHTML="<p style='color:red;text-align:center;'>No schedule found for that ID.</p>";
      return;
    }
    container.innerHTML = `<div class="schedule-grid">${userRows.map(createCardHTML).join("")}</div>`;
    return;
  }

  // Admin: group all user rows
  const groups = {"Day 1":[], "Day 2":[], "Families Day 1":[], "Families Day 2":[]};
  const suffixMap = {"1":"Day 1","2":"Day 2","3":"Families Day 1","4":"Families Day 2"};
  const byUser = {};
  allRows.forEach(r=>{
    byUser[r.id] = byUser[r.id]||[];
    byUser[r.id].push(r);
  });
  Object.entries(byUser).forEach(([uid,rows])=>{
    const suffix = uid.match(/\d$/)?.[0];
    const g = suffixMap[suffix];
    if(g) groups[g].push({uid,rows});
  });

  masterDiv.innerHTML = Object.entries(groups).map(([grp,users])=>`
    <div class="session-group">
      <div class="section-header">${grp}</div>
      <div class="group-section">
        ${users.map(u=>renderDropdown(u.uid,u.rows)).join("")}
      </div>
    </div>
  `).join("");
  container.innerHTML = "<p style='text-align:center;'>Admin view loaded. Use search above.</p>";
}
</script>
</body>
</html>
