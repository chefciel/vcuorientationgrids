<!DOCTYPE html>
<html>
<head>
  <title>VCU Schedule Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #F7F7F7;
      padding: 20px;
      color: #231F20;
    }
    h1 {
      color: #F0B323;
      text-align: center;
    }
    .input-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      justify-content: center;
    }
    input, button {
      padding: 10px;
      font-size: 1em;
    }
    .card {
      border: 2px solid #F0B323;
      border-radius: 10px;
      padding: 15px;
      background: #fff;
      flex: 1 1 300px;
      box-sizing: border-box;
    }
    .card strong {
      display: block;
      font-size: 1.1em;
      margin-bottom: 5px;
      color: #00558C;
    }
    #vcu-logo {
      display: block;
      margin: 0 auto 20px;
      max-width: 150px;
    }
    .dropdown-label {
      cursor: pointer;
      font-weight: bold;
      padding: 10px;
      background-color: #F0B323;
      color: #fff;
      border-radius: 8px;
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-content {
      display: none;
      padding: 10px;
    }
    .arrow {
      display: inline-block;
      transition: transform 0.2s;
    }
    #masterPasswordContainer, #masterSearchContainer, #exitAdminBtn {
      display: none;
      text-align: center;
      margin-bottom: 10px;
    }
    .user-section, .group-section {
      margin-bottom: 10px;
    }
    .section-header {
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      margin-top: 40px;
      color: #00558C;
    }
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
  </style>
</head>
<body>
  <img src="https://cumulusassociation.org/wp-content/uploads/2021/10/VCU-Logo-Seal-Virginia-Commonwealth-University1.png" id="vcu-logo" alt="VCU Logo" />
  <h1>Orientation Grids Viewer</h1>

  <div class="input-group">
    <input type="text" id="userId" placeholder="Enter your ID" />
    <button onclick="loadSchedule()">View Schedule</button>
  </div>

  <div class="input-group">
    <div class="collapsible-label" onclick="togglePassword()">
      <span id="arrow">▸</span> Show Master Schedule Access
    </div>
  </div>

  <div id="masterPasswordContainer">
    <input type="password" id="masterPassword" placeholder="Enter master password" />
  </div>

  <div id="masterSearchContainer">
    <input type="text" id="masterSearch" placeholder="Search by any keyword..." />
    <button id="masterSearchBtn">Search</button>
  </div>

  <div id="exitAdminBtn">
    <button onclick="exitAdminMode()">Exit Admin Mode</button>
  </div>

  <div id="scheduleContainer"></div>
  <div id="masterSchedule"></div>

<script>
  const SHEET_ID = "1Uafwo7ikADBeXOnof6Fq1LSKXVWfP9kJDMWsg2VirWE";
  const allTabs = [
    "6/23-24", "6/26-27", "6/30", "7/7-8", "7/10-11", "7/14-15", "7/17-18", "7/21-22", "7/24", "8/15", "Transfer Session"
  ];

  const sessionDateMap = {
    "2025-06-18": "6/23-24",
    "2025-06-20": "6/23-24",
    "2025-06-21": "6/23-24",
    "2025-06-22": "6/23-24",
    "2025-06-23": "6/23-24",
    "2025-06-24": "6/23-24",
    "2025-06-25": "6/26-27",
    "2025-06-26": "6/26-27",
    "2025-06-27": "6/26-27",
    "2025-06-30": "6/30",
    "2025-07-07": "7/7-8",
    "2025-07-08": "7/7-8",
    "2025-07-10": "7/10-11",
    "2025-07-11": "7/10-11",
    "2025-07-14": "7/14-15",
    "2025-07-15": "7/14-15",
    "2025-07-17": "7/17-18",
    "2025-07-18": "7/17-18",
    "2025-07-21": "7/21-22",
    "2025-07-22": "7/21-22",
    "2025-07-24": "7/24",
    "2025-08-24": "8/15"
  };

  const MASTER_PASSWORD = "master123";
  let isAdmin = false;

  function getTodayDateString() {
    return new Date().toISOString().split("T")[0];
  }

  function getTodayTabs() {
    const session = sessionDateMap[getTodayDateString()];
    if (!session) {
      alert("No session is mapped for today.");
      return [];
    }
    return allTabs.filter(tab => tab === session);
  }

  function togglePassword() {
    const container = document.getElementById("masterPasswordContainer");
    const arrow = document.getElementById("arrow");
    const visible = container.style.display === "block";
    container.style.display = visible ? "none" : "block";
    arrow.textContent = visible ? "▸" : "▾";
  }

  function exitAdminMode() {
    isAdmin = false;
    document.getElementById("masterSearchContainer").style.display = "none";
    document.getElementById("exitAdminBtn").style.display = "none";
    document.getElementById("masterPassword").value = "";
    document.getElementById("masterSchedule").innerHTML = "";
  }

  document.getElementById("userId").addEventListener("keydown", e => {
    if (e.key === "Enter") loadSchedule();
  });

  document.getElementById("masterPassword").addEventListener("keydown", e => {
    if (e.key === "Enter") loadSchedule();
  });

  document.getElementById("masterSearchBtn").addEventListener("click", filterMasterDropdowns);
  document.getElementById("masterSearch").addEventListener("keydown", e => {
    if (e.key === "Enter") filterMasterDropdowns();
  });

  // Extract hyperlink URL from .f field (formatted HTML) if exists
  function extractHyperlink(cell) {
    if (!cell || !cell.f) return null;
    const html = cell.f;
    const match = html.match(/<a href="([^"]+)"/);
    return match ? match[1] : null;
  }

  async function loadSchedule() {
    const userId = document.getElementById("userId").value.trim().toLowerCase();
    const password = document.getElementById("masterPassword").value.trim();
    const container = document.getElementById("scheduleContainer");
    const masterDiv = document.getElementById("masterSchedule");
    container.innerHTML = "Loading...";
    masterDiv.innerHTML = "";

    const SHEET_TABS = isAdmin ? allTabs : getTodayTabs();

    if (!SHEET_TABS.length) {
      container.innerHTML = "<p style='text-align:center; color:red;'>No session data available for today.</p>";
      return;
    }

    let allRows = [];

    for (const tab of SHEET_TABS) {
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`;
        const res = await fetch(url);
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const rows = json.table.rows;

        const formatted = rows.map(r => {
          const id = r.c[0]?.v?.toLowerCase()?.trim() || "";
          const time = r.c[1]?.v || "Unknown Time";

          // Handle activity with hyperlink detection
          let activityText = r.c[2]?.v || "";
          let activityLink = extractHyperlink(r.c[2]);
          if (activityLink) {
            activityText = `<a href="${activityLink}" target="_blank" rel="noopener noreferrer">${activityText}</a>`;
          }

          // Handle location with hyperlink detection
          let locationText = r.c[3]?.v || "";
          let locationLink = extractHyperlink(r.c[3]);
          if (locationLink) {
            locationText = `<a href="${locationLink}" target="_blank" rel="noopener noreferrer">${locationText}</a>`;
          }

          return {
            id,
            time,
            activity: activityText,
            location: locationText,
            tab: tab
          };
        }).filter(r => r.id && r.id !== "hidden" && r.id !== "_blank_");

        allRows = allRows.concat(formatted);
      } catch (err) {
        console.error(`Error loading sheet "${tab}":`, err);
      }
    }

    isAdmin = password === MASTER_PASSWORD;
    document.getElementById("masterSearchContainer").style.display = isAdmin ? "block" : "none";
    document.getElementById("exitAdminBtn").style.display = isAdmin ? "block" : "none";

    const userFiltered = allRows.filter(r => r.id === userId);

    if (!userFiltered.length && !isAdmin) {
      container.innerHTML = "<p style='color:red; text-align:center;'>No schedule found for this ID.</p>";
      return;
    }

    if (!isAdmin) {
      // Regular user schedule view with clickable links
      const cards = userFiltered.map(item => `
        <div class="card">
          <strong>${item.time}</strong>
          ${item.activity}<br />
          <em>${item.location}</em>
        </div>`).join("");
      container.innerHTML = `<div class="schedule-grid">${cards}</div>`;
      return;
    }

    // Admin view with sessions dropdown
    container.innerHTML = "";
    masterDiv.innerHTML = "";

    // Group by tab/session first
    const sessionGroups = {};
    for (const tab of allTabs) {
      sessionGroups[tab] = [];
    }
    allRows.forEach(item => {
      if (sessionGroups[item.tab]) sessionGroups[item.tab].push(item);
      else sessionGroups["Transfer Session"].push(item);
    });

    for (const [session, entries] of Object.entries(sessionGroups)) {
      if (entries.length === 0) continue;

      // Create session dropdown
      const sessionSection = document.createElement("div");
      sessionSection.className = "session-group";

      const sessionLabel = document.createElement("div");
      sessionLabel.className = "dropdown-label";
      sessionLabel.innerHTML = `<span>${session} (${[...new Set(entries.map(e => e.id))].length})</span> <span class="arrow">▸</span>`;
      sessionSection.appendChild(sessionLabel);

      const sessionContent = document.createElement("div");
      sessionContent.className = "dropdown-content";
      sessionSection.appendChild(sessionContent);

      // Group entries by suffix (1-4) inside session
      const groups = {
        "Day 1": [],
        "Day 2": [],
        "Families Day 1": [],
        "Families Day 2": [],
        "Unmatched IDs": []
      };

      for (const item of entries) {
        const id = item.id.toLowerCase().trim();
        if (!id) continue;
        const match = id.match(/^(.+?)([1-4])$/);
        if (!match) {
          groups["Unmatched IDs"].push(item);
          continue;
        }
        const suffix = match[2];
        if (suffix === "1") groups["Day 1"].push(item);
        else if (suffix === "2") groups["Day 2"].push(item);
        else if (suffix === "3") groups["Families Day 1"].push(item);
        else if (suffix === "4") groups["Families Day 2"].push(item);
      }

      // Create dropdowns for each group inside session
      for (const [group, groupEntries] of Object.entries(groups)) {
        if (groupEntries.length === 0) continue;

        const groupSection = document.createElement("div");
        groupSection.className = "group-section";

        const groupLabel = document.createElement("div");
        groupLabel.className = "dropdown-label";
        const uniqueCount = [...new Set(groupEntries.map(e => e.id.replace(/[^a-zA-Z]/g, "").toUpperCase()))].length;
        groupLabel.innerHTML = `<span>${group} (${uniqueCount})</span> <span class="arrow">▸</span>`;
        groupSection.appendChild(groupLabel);

        const groupContent = document.createElement("div");
        groupContent.className = "dropdown-content schedule-grid";
        groupSection.appendChild(groupContent);

        // Group entries by unique user name (letters only)
        const uniqueNames = [...new Set(groupEntries.map(e => e.id.replace(/[^a-zA-Z]/g, "").toUpperCase()))];

        for (const name of uniqueNames) {
          const filtered = groupEntries.filter(e => e.id.replace(/[^a-zA-Z]/g, "").toUpperCase() === name);

          const userSection = document.createElement("div");
          userSection.className = "user-section";

          const label = document.createElement("div");
          label.className = "dropdown-label";
          label.innerHTML = `<span>${name}</span> <span class="arrow">▸</span>`;
          userSection.appendChild(label);

          const content = document.createElement("div");
          content.className = "dropdown-content schedule-grid";
          content.style.display = "none";

          for (const item of filtered) {
            content.innerHTML += `
              <div class="card">
                <strong>${item.time}</strong>
                ${item.activity}<br />
                <em>${item.location}</em><br />
                <small style="color:gray;">User ID: ${item.id}</small>
              </div>`;
          }

          label.addEventListener("click", () => {
            const expanded = content.style.display === "block";
            content.style.display = expanded ? "none" : "block";
            label.querySelector(".arrow").style.transform = expanded ? "rotate(0deg)" : "rotate(90deg)";
          });

          userSection.appendChild(content);
          groupContent.appendChild(userSection);
        }

        groupLabel.addEventListener("click", () => {
          const expanded = groupContent.style.display === "block";
          groupContent.style.display = expanded ? "none" : "block";
          groupLabel.querySelector(".arrow").style.transform = expanded ? "rotate(0deg)" : "rotate(90deg)";
        });

        sessionContent.appendChild(groupSection);
      }

      sessionLabel.addEventListener("click", () => {
        const expanded = sessionContent.style.display === "block";
        sessionContent.style.display = expanded ? "none" : "block";
        sessionLabel.querySelector(".arrow").style.transform = expanded ? "rotate(0deg)" : "rotate(90deg)";
      });

      masterDiv.appendChild(sessionSection);
    }
  }
</script>
</body>
</html>
