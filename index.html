<!DOCTYPE html>
<html>
<head>
  <title>VCU Schedule Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #F7F7F7;
      padding: 20px;
      color: #231F20;
    }
    h1 {
      color: #F0B323;
      text-align: center;
    }
    .input-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      justify-content: center;
    }
    input, button {
      padding: 10px;
      font-size: 1em;
    }
    .card {
      border: 2px solid #F0B323;
      border-radius: 10px;
      padding: 15px;
      background: #fff;
      flex: 1 1 300px;
      box-sizing: border-box;
    }
    .card strong {
      display: block;
      font-size: 1.1em;
      margin-bottom: 5px;
      color: #00558C;
    }
    .card .activity-text {
      font-size: 1.0em;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .card .location-text {
      font-size: 0.8em;
      font-style: italic;
      color: #444;
    }
    #vcu-logo {
      display: block;
      margin: 0 auto 20px;
      max-width: 150px;
    }
    .dropdown-label {
      cursor: pointer;
      font-weight: bold;
      padding: 10px;
      background-color: #F0B323;
      color: #fff;
      border-radius: 8px;
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-content {
      display: none;
      padding: 10px;
    }
    .arrow {
      display: inline-block;
      transition: transform 0.2s;
    }
    #masterPasswordContainer, #masterSearchContainer, #exitAdminBtn {
      display: none;
      text-align: center;
      margin-bottom: 10px;
    }
    .user-section, .group-section {
      margin-bottom: 10px;
    }
    .section-header {
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      margin-top: 40px;
      color: #00558C;
    }
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
  </style>
</head>
<body>
  <img src="https://cumulusassociation.org/wp-content/uploads/2021/10/VCU-Logo-Seal-Virginia-Commonwealth-University1.png" id="vcu-logo" alt="VCU Logo" />
  <h1>Orientation Grids Viewer</h1>

  <div class="input-group">
    <input type="text" id="userId" placeholder="Enter your ID" />
    <button onclick="loadSchedule()">View Schedule</button>
  </div>

  <div class="input-group">
    <div class="collapsible-label" onclick="togglePassword()">
      <span id="arrow">▸</span> Show Master Schedule Access
    </div>
  </div>

  <div id="masterPasswordContainer">
    <input type="password" id="masterPassword" placeholder="Enter master password" />
  </div>

  <div id="masterSearchContainer">
    <input type="text" id="masterSearch" placeholder="Search by any keyword..." />
    <button id="masterSearchBtn">Search</button>
  </div>

  <div id="exitAdminBtn">
    <button onclick="exitAdminMode()">Exit Admin Mode</button>
  </div>

  <div id="scheduleContainer"></div>
  <div id="masterSchedule"></div>

  <script>
  const SHEET_ID = "1Uafwo7ikADBeXOnof6Fq1LSKXVWfP9kJDMWsg2VirWE";
  const allTabs = ["6/23-24", "6/26-27", "6/30", "7/7-8", "7/10-11", "7/14-15", "7/17-18", "7/21-22", "7/24", "8/15", "Transfer Session"];
  const sessionDateMap = {
    "2025-06-23": "6/23-24", "2025-06-24": "6/23-24",
    "2025-06-25": "6/26-27", "2025-06-26": "6/26-27", "2025-06-27": "6/26-27",
    "2025-06-29": "6/30", "2025-06-30": "6/30",
    "2025-07-07": "7/7-8", "2025-07-08": "7/7-8",
    "2025-07-10": "7/10-11", "2025-07-11": "7/10-11",
    "2025-07-14": "7/14-15", "2025-07-15": "7/14-15",
    "2025-07-17": "7/17-18", "2025-07-18": "7/17-18",
    "2025-07-21": "7/21-22", "2025-07-22": "7/21-22",
    "2025-07-24": "7/24", "2025-08-15": "8/15"
  };
  const MASTER_PASSWORD = "master123";
  let isAdmin = false;

  const getTodayDateString = () => new Date().toISOString().split("T")[0];
  const getTodayTabs = () => {
    const session = sessionDateMap[getTodayDateString()];
    if (!session) return [];
    return allTabs.filter(tab => tab === session);
  };

  function togglePassword() {
    const container = document.getElementById("masterPasswordContainer");
    const arrow = document.getElementById("arrow");
    const visible = container.style.display === "block";
    container.style.display = visible ? "none" : "block";
    arrow.textContent = visible ? "▸" : "▾";
  }

  function exitAdminMode() {
    isAdmin = false;
    document.getElementById("masterSearchContainer").style.display = "none";
    document.getElementById("exitAdminBtn").style.display = "none";
    document.getElementById("masterPassword").value = "";
    document.getElementById("masterSchedule").innerHTML = "";
  }

  document.getElementById("userId").addEventListener("keydown", e => { if (e.key === "Enter") loadSchedule(); });
  document.getElementById("masterPassword").addEventListener("keydown", e => { if (e.key === "Enter") loadSchedule(); });
  document.getElementById("masterSearchBtn").addEventListener("click", filterMasterDropdowns);
  document.getElementById("masterSearch").addEventListener("keydown", e => { if (e.key === "Enter") filterMasterDropdowns(); });

  function filterMasterDropdowns() {
    const term = document.getElementById("masterSearch").value.trim().toLowerCase();
    const userSections = document.querySelectorAll(".user-section");
    userSections.forEach(section => {
      const textContent = section.innerText.toLowerCase();
      section.style.display = textContent.includes(term) ? "" : "none";
    });
    document.querySelectorAll(".group-section").forEach(group => {
      const visible = [...group.querySelectorAll(".user-section")].some(u => u.style.display !== "none");
      group.style.display = visible ? "" : "none";
    });
    document.querySelectorAll(".session-group").forEach(sess => {
      const visible = [...sess.querySelectorAll(".group-section")].some(g => g.style.display !== "none");
      sess.style.display = visible ? "" : "none";
    });
  }

  function extractLink(text) {
    if (!text) return "";
    const hyperlinkFormulaRegex = /^=HYPERLINK\("([^"]+)","([^"]+)"\)$/i;
    const match = text.match(hyperlinkFormulaRegex);
    if (match) return `<a href="${match[1]}" target="_blank" rel="noopener noreferrer">${match[2]}</a>`;
    if (/^(https?:\/\/)/i.test(text)) return `<a href="${text}" target="_blank" rel="noopener noreferrer">${text}</a>`;
    return text;
  }

  async function loadSchedule() {
    const userId = document.getElementById("userId").value.trim().toLowerCase();
    const password = document.getElementById("masterPassword").value.trim();
    const container = document.getElementById("scheduleContainer");
    const masterDiv = document.getElementById("masterSchedule");
    container.innerHTML = "Loading...";
    masterDiv.innerHTML = "";

    const SHEET_TABS = getTodayTabs();
    if (!SHEET_TABS.length) {
      container.innerHTML = "<p style='text-align:center; color:red;'>No session data available for today.</p>";
      return;
    }

    let allRows = [];
    for (const tab of SHEET_TABS) {
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`;
        const res = await fetch(url);
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const rows = json.table.rows;
        const formatted = rows.map(r => ({
          id: r.c[0]?.v?.toLowerCase()?.trim() || "",
          time: r.c[1]?.v || "Unknown Time",
          activity: r.c[2]?.f || r.c[2]?.v || "",
          location: r.c[3]?.f || r.c[3]?.v || "",
          tab: tab
        })).filter(r => r.id && r.id !== "hidden" && r.id !== "_blank_");
        allRows = allRows.concat(formatted);
      } catch (err) {
        console.error(`Error loading sheet "${tab}":`, err);
      }
    }

    isAdmin = password === MASTER_PASSWORD;
    document.getElementById("masterSearchContainer").style.display = isAdmin ? "block" : "none";
    document.getElementById("exitAdminBtn").style.display = isAdmin ? "block" : "none";

    const allRowsBySuffix = {};
    allRows.forEach(row => { if (/^all[1-4]$/.test(row.id)) allRowsBySuffix[row.id] = row; });

    const mergeWithAllRows = rows => {
      const suffixes = new Set(rows.map(r => r.id.match(/([1-4])$/)?.[1]).filter(Boolean));
      const allPrepended = [...suffixes].map(s => allRowsBySuffix[`all${s}`]).filter(Boolean);
      return [...allPrepended, ...rows];
    };

    const filterTopRows = rows => ({
      topRows: rows.filter(r => r.activity.trim().toUpperCase() === "TOP"),
      otherRows: rows.filter(r => r.activity.trim().toUpperCase() !== "TOP")
    });

    const createCardHTML = item => `
      <div class="card">
        <strong>${item.time}</strong>
        <div class="activity-text">${extractLink(item.activity)}</div>
        <div class="location-text">${extractLink(item.location)}</div>
        <small style="color:gray;">User ID: ${item.id}</small>
      </div>`;

    if (!isAdmin) {
      let userFiltered = allRows.filter(r => r.id === userId);
      if (!userFiltered.length) {
        container.innerHTML = "<p style='color:red; text-align:center;'>No schedule found for this ID.</p>";
        return;
      }
      userFiltered = mergeWithAllRows(userFiltered);
      const { topRows, otherRows } = filterTopRows(userFiltered);
      container.innerHTML = `<div class="schedule-grid">${topRows.map(createCardHTML).join("")}${otherRows.map(createCardHTML).join("")}</div>`;
      return;
    }

    container.innerHTML = "";
    masterDiv.innerHTML = "";

    const sessionGroups = {};
    for (const tab of SHEET_TABS) sessionGroups[tab] = [];
    allRows.forEach(row => sessionGroups[row.tab]?.push(row));

    for (const [session, entries] of Object.entries(sessionGroups)) {
      if (!entries.length) continue;

      const sessionSection = document.createElement("div");
      sessionSection.className = "session-group";
      const sessionLabel = document.createElement("div");
      sessionLabel.className = "dropdown-label";
      sessionLabel.innerHTML = `<span>${session}</span> <span class="arrow">▸</span>`;
      sessionSection.appendChild(sessionLabel);

      const sessionContent = document.createElement("div");
      sessionContent.className = "dropdown-content";
      sessionSection.appendChild(sessionContent);

      const groupMap = { "Day 1": [], "Day 2": [], "Families Day 1": [], "Families Day 2": [], "Unmatched IDs": [] };
      entries.forEach(row => {
        const match = row.id.match(/^(.+?)([1-4])$/);
        if (!match) groupMap["Unmatched IDs"].push(row);
        else {
          const suffix = match[2];
          if (suffix === "1") groupMap["Day 1"].push(row);
          else if (suffix === "2") groupMap["Day 2"].push(row);
          else if (suffix === "3") groupMap["Families Day 1"].push(row);
          else if (suffix === "4") groupMap["Families Day 2"].push(row);
        }
      });

      for (const [groupName, groupEntries] of Object.entries(groupMap)) {
        if (!groupEntries.length) continue;

        const groupSection = document.createElement("div");
        groupSection.className = "group-section";
        const groupLabel = document.createElement("div");
        groupLabel.className = "dropdown-label";
        const uniqueCount = [...new Set(groupEntries.map(e => e.id.replace(/[^a-zA-Z]/g, "").toUpperCase()))].length;
        groupLabel.innerHTML = `<span>${groupName} (${uniqueCount})</span> <span class="arrow">▸</span>`;
        groupSection.appendChild(groupLabel);

        const groupContent = document.createElement("div");
        groupContent.className = "dropdown-content schedule-grid";
        groupContent.style.display = "none";
        groupSection.appendChild(groupContent);

        const uniqueNames = [...new Set(groupEntries.map(e => e.id.replace(/[^a-zA-Z]/g, "").toUpperCase()))];
        for (const name of uniqueNames) {
          const filtered = groupEntries.filter(e => e.id.replace(/[^a-zA-Z]/g, "").toUpperCase() === name);
          const merged = mergeWithAllRows(filtered);
          const { topRows, otherRows } = filterTopRows(merged);

          const userSection = document.createElement("div");
          userSection.className = "user-section";
          const userLabel = document.createElement("div");
          userLabel.className = "dropdown-label";
          userLabel.innerHTML = `<span>${name}</span> <span class="arrow">▸</span>`;
          const userContent = document.createElement("div");
          userContent.className = "dropdown-content schedule-grid";
          userContent.style.display = "none";
          topRows.forEach(r => userContent.innerHTML += createCardHTML(r));
          otherRows.forEach(r => userContent.innerHTML += createCardHTML(r));

          userLabel.addEventListener("click", () => {
            const expanded = userContent.style.display === "block";
            userContent.style.display = expanded ? "none" : "block";
            userLabel.querySelector(".arrow").style.transform = expanded ? "rotate(0deg)" : "rotate(90deg)";
          });

          userSection.appendChild(userLabel);
          userSection.appendChild(userContent);
          groupContent.appendChild(userSection);
        }

        groupLabel.addEventListener("click", () => {
          const expanded = groupContent.style.display === "block";
          groupContent.style.display = expanded ? "none" : "block";
          groupLabel.querySelector(".arrow").style.transform = expanded ? "rotate(0deg)" : "rotate(90deg)";
        });

        sessionContent.appendChild(groupSection);
      }

      sessionLabel.addEventListener("click", () => {
        const expanded = sessionContent.style.display === "block";
        sessionContent.style.display = expanded ? "none" : "block";
        sessionLabel.querySelector(".arrow").style.transform = expanded ? "rotate(0deg)" : "rotate(90deg)";
      });

      masterDiv.appendChild(sessionSection);
    }
  }
</script>
</body>
</html>
