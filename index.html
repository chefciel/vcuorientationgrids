<!DOCTYPE html>
<html>
<head>
  <title>VCU Schedule Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #F7F7F7;
      padding: 20px;
      color: #231F20;
    }
    h1 {
      color: #F0B323;
      text-align: center;
    }
    .input-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      justify-content: center;
    }
    input, button {
      padding: 10px;
      font-size: 1em;
    }
    .card {
      border: 2px solid #F0B323;
      border-radius: 10px;
      padding: 15px;
      background: #fff;
      flex: 1 1 300px;
      box-sizing: border-box;
      position: relative;
      transition: background-color 0.3s, box-shadow 0.3s, border-color 0.3s;
    }
    .card.top-row {
      border-color: #D72631;
      background: #FFE6E8;
    }
    .card strong {
      display: block;
      font-size: 1.1em;
      margin-bottom: 5px;
      color: #00558C;
    }
    .card .activity-text {
      font-size: 1.0em;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .card .location-text {
      font-size: 0.8em;
      font-style: italic;
      color: #444;
    }
    .card.yellow-highlight {
      border-color: #F0B323;
      background-color: #FFF8E1; /* soft yellow */
      box-shadow: 0 0 8px rgba(240, 179, 35, 0.5);
    }
    .card.red-highlight {
      border-color: #D72631;
      background-color: #FFE6E8; /* light red/pink */
      box-shadow: 0 0 8px rgba(215, 38, 49, 0.6);
    }
    .card.red-highlight .now-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #D72631;
      color: #fff;
      font-size: 0.7em;
      padding: 2px 6px;
      border-radius: 5px;
      font-weight: bold;
      user-select: none;
    }
    #vcu-logo {
      display: block;
      margin: 0 auto 20px;
      max-width: 150px;
    }
    .dropdown-label {
      cursor: pointer;
      font-weight: bold;
      padding: 10px;
      background-color: #F0B323;
      color: #fff;
      border-radius: 8px;
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-content {
      display: none;
      padding: 10px;
    }
    .arrow {
      display: inline-block;
      transition: transform 0.2s;
    }
    #masterPasswordContainer, #masterSearchContainer, #exitAdminBtn {
      display: none;
      text-align: center;
      margin-bottom: 10px;
    }
    .user-section, .group-section {
      margin-bottom: 10px;
    }
    .section-header {
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      margin-top: 40px;
      color: #00558C;
    }
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
    .pinned-rows {
      margin-bottom: 15px;
    }
    .global-tag-section {
      margin-bottom: 30px;
      border: 2px solid #D72631;
      border-radius: 10px;
      padding: 15px;
      background: #FFF4F5;
    }
    .global-tag-title {
      font-weight: bold;
      color: #D72631;
      font-size: 1.3em;
      margin-bottom: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <img src="https://cumulusassociation.org/wp-content/uploads/2021/10/VCU-Logo-Seal-Virginia-Commonwealth-University1.png" id="vcu-logo" alt="VCU Logo" />
  <h1>Orientation Grids Viewer</h1>

  <div class="input-group">
    <input type="text" id="userId" placeholder="Enter your ID" />
    <button onclick="loadSchedule()">View Schedule</button>
  </div>

  <div class="input-group">
    <div class="collapsible-label" onclick="togglePassword()">
      <span id="arrow">▸</span> Show Master Schedule Access
    </div>
  </div>

  <div id="masterPasswordContainer">
    <input type="password" id="masterPassword" placeholder="Enter master password" />
  </div>

  <div id="masterSearchContainer">
    <input type="text" id="masterSearch" placeholder="Search by any keyword..." />
    <button id="masterSearchBtn">Search</button>
  </div>

  <div id="exitAdminBtn">
    <button onclick="exitAdminMode()">Exit Admin Mode</button>
  </div>

  <div id="scheduleContainer"></div>
  <div id="masterSchedule"></div>

  <script>
    const SHEET_ID = "1Uafwo7ikADBeXOnof6Fq1LSKXVWfP9kJDMWsg2VirWE";
    const allTabs = ["6/23-24", "6/26-27", "6/30", "7/7-8", "7/10-11", "7/14-15", "7/17-18", "7/21-22", "7/24", "8/15", "Transfer Session"];
    const sessionDateMap = {
      "2025-06-23": "6/23-24", "2025-06-24": "6/23-24",
      "2025-06-25": "6/26-27", "2025-06-26": "6/26-27", "2025-06-27": "6/26-27",
      "2025-06-29": "6/30", "2025-06-30": "6/30",
      "2025-07-03": "7/7-8", "2025-07-04": "7/7-8", "2025-07-05": "7/7-8", "2025-07-06": "7/7-8", "2025-07-07": "7/7-8", "2025-07-08": "7/7-8",
      "2025-07-10": "7/10-11", "2025-07-11": "7/10-11",
      "2025-07-14": "7/14-15", "2025-07-15": "7/14-15",
      "2025-07-17": "7/17-18", "2025-07-18": "7/17-18",
      "2025-07-21": "7/21-22", "2025-07-22": "7/21-22",
      "2025-07-24": "7/24", "2025-08-15": "8/15"
    };
    const MASTER_PASSWORD = "master123";
    let isAdmin = false;
    let autoRefreshInterval = null;

    document.getElementById("userId").addEventListener("keydown", e => { if (e.key === "Enter") loadSchedule(); });
    document.getElementById("masterPassword").addEventListener("keydown", e => { if (e.key === "Enter") loadSchedule(); });
    document.getElementById("masterSearchBtn").addEventListener("click", filterMasterDropdowns);
    document.getElementById("masterSearch").addEventListener("keydown", e => { if (e.key === "Enter") filterMasterDropdowns(); });

    function togglePassword() {
      const container = document.getElementById("masterPasswordContainer");
      const arrow = document.getElementById("arrow");
      const visible = container.style.display === "block";
      container.style.display = visible ? "none" : "block";
      arrow.textContent = visible ? "▸" : "▾";
    }

    function exitAdminMode() {
      isAdmin = false;
      clearInterval(autoRefreshInterval);
      document.getElementById("masterSearchContainer").style.display = "none";
      document.getElementById("exitAdminBtn").style.display = "none";
      document.getElementById("masterPassword").value = "";
      document.getElementById("masterSchedule").innerHTML = "";
      document.getElementById("scheduleContainer").innerHTML = "";
      document.getElementById("userId").value = "";
    }

    function getTodayDateString() {
      return new Date().toISOString().split("T")[0];
    }

    function getTodayTabs() {
      const session = sessionDateMap[getTodayDateString()];
      return session ? allTabs.filter(tab => tab === session) : [];
    }

    function extractLink(text) {
      if (!text) return "";
      const hyperlinkFormulaRegex = /^=HYPERLINK\("([^"]+)","([^"]+)"\)$/i;
      const match = text.match(hyperlinkFormulaRegex);
      if (match) return `<a href="${match[1]}" target="_blank" rel="noopener noreferrer">${match[2]}</a>`;
      if (/^(https?:\/\/)/i.test(text)) return `<a href="${text}" target="_blank" rel="noopener noreferrer">${text}</a>`;
      return text;
    }

    function parseTimeString(timeStr) {
      // Convert time string like "9:00 AM" or "12:30 PM" into a Date object today
      const now = new Date();
      const todayStr = now.toDateString();
      try {
        return new Date(`${todayStr} ${timeStr.trim()}`);
      } catch {
        return null;
      }
    }

    // Parse time or range, return object {start: Date, end: Date|null}
    function parseEventTimes(timeStr) {
      if (!timeStr) return null;
      const parts = timeStr.split("-");
      const now = new Date();
      const todayStr = now.toDateString();

      if (parts.length === 2) {
        const start = parseTimeString(parts[0]);
        const end = parseTimeString(parts[1]);
        if (start && end) return { start, end };
      } else if (parts.length === 1) {
        const start = parseTimeString(parts[0]);
        if (start) return { start, end: null };
      }
      return null;
    }

    // Given array of event objects sorted by start time, determine highlight class for one event based on current time and next event
    function getHighlightClass(event, nextEvent) {
      const now = new Date();
      const FIVE_MINUTES = 5 * 60 * 1000;

      if (!event.times) return ""; // no time info

      // Yellow highlight: from 5 minutes before start until start
      const yellowStart = new Date(event.times.start.getTime() - FIVE_MINUTES);
      const start = event.times.start;
      const end = event.times.end;

      // For red highlight end time: 
      // if end exists, use it
      // else if nextEvent exists, use nextEvent start
      // else no end - highlight indefinitely
      let redHighlightEnd = null;
      if (end) {
        redHighlightEnd = end;
      } else if (nextEvent && nextEvent.times) {
        redHighlightEnd = nextEvent.times.start;
      }

      if (now >= yellowStart && now < start) {
        return "yellow-highlight";
      }

      if (now >= start) {
        if (!redHighlightEnd || now < redHighlightEnd) {
          return "red-highlight";
        }
      }

      return "";
    }

    function createCardHTML(item, highlightClass) {
      const globalTags = ["TOP", "ANNOUNCEMENT"];
      const isPinned = globalTags.includes(item.activity.trim().toUpperCase());

      return `
        <div class="card ${isPinned ? "top-row" : ""} ${highlightClass}">
          ${highlightClass === "red-highlight" ? '<div class="now-badge">Happening now</div>' : ""}
          <strong>${item.time}</strong>
          <div class="activity-text">${extractLink(item.activity)}</div>
          <div class="location-text">${extractLink(item.location)}</div>
          <small style="color:gray;">User ID: ${item.id}</small>
        </div>`;
    }

    const renderDropdown = (userId, rows) => {
      const displayName = userId.replace(/\d$/, '');
      const globalTags = ["TOP", "ANNOUNCEMENT"];
      const pinnedRows = rows.filter(r => globalTags.includes(r.activity.trim().toUpperCase()));
      const normalRows = rows.filter(r => !globalTags.includes(r.activity.trim().toUpperCase()));

      // Sort normalRows by start time for highlight logic
      normalRows.forEach(r => r.times = parseEventTimes(r.time));
      normalRows.sort((a, b) => {
        if (!a.times || !b.times) return 0;
        return a.times.start - b.times.start;
      });

      // For each normal event find next event for highlight calculation
      const normalHTML = normalRows.map((r, i) => {
        const next = normalRows[i + 1];
        const highlightClass = getHighlightClass(r, next);
        return createCardHTML(r, highlightClass);
      }).join("");

      const pinnedHTML = pinnedRows.length ? `
        <div class="pinned-rows">
          ${pinnedRows.map(r => createCardHTML(r, "")).join('')}
        </div>` : "";

      return `
        <div class="user-section">
          <div class="dropdown-label" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block';">
            ${displayName} <span class="arrow">▾</span>
          </div>
          <div class="dropdown-content">
            ${pinnedHTML}
            <div class="schedule-grid">
              ${normalHTML}
            </div>
          </div>
        </div>`;
    };

    async function loadSchedule() {
      const userId = document.getElementById("userId").value.trim().toLowerCase();
      const password = document.getElementById("masterPassword").value.trim();
      const container = document.getElementById("scheduleContainer");
      const masterDiv = document.getElementById("masterSchedule");
      container.innerHTML = "Loading...";
      masterDiv.innerHTML = "";

      const SHEET_TABS = getTodayTabs();
      if (!SHEET_TABS.length) {
        container.innerHTML = "<p style='text-align:center; color:red;'>No session data available for today.</p>";
        return;
      }

      clearInterval(autoRefreshInterval);
      autoRefreshInterval = setInterval(() => loadSchedule(), 120000); // Refresh every 2 minutes

      let allRows = [];
      for (const tab of SHEET_TABS) {
        try {
          const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`;
          const res = await fetch(url);
          const text = await res.text();
          const json = JSON.parse(text.substring(47).slice(0, -2));
          const rows = json.table.rows.map(r => ({
            id: (r.c[0]?.f || r.c[0]?.v || "").toLowerCase().trim(),
            time: r.c[1]?.v || "Unknown Time",
            activity: r.c[2]?.f || r.c[2]?.v || "",
            location: r.c[3]?.f || r.c[3]?.v || "",
            tab
          })).filter(r => r.id && r.id !== "hidden" && r.id !== "_blank_");
          allRows = allRows.concat(rows);
        } catch (err) {
          console.error(`Error loading sheet "${tab}":`, err);
        }
      }

      isAdmin = password === MASTER_PASSWORD;
      document.getElementById("masterSearchContainer").style.display = isAdmin ? "block" : "none";
      document.getElementById("exitAdminBtn").style.display = isAdmin ? "block" : "none";

      const globalPinnedTags = ["TOP", "ANNOUNCEMENT"];
      const globalPinnedRows = allRows.filter(r => globalPinnedTags.includes(r.activity.trim().toUpperCase()));
      const allRowsBySuffix = {};
      allRows.forEach(row => {
        if (/^all[1-4]$/.test(row.id)) {
          if (!allRowsBySuffix[row.id]) allRowsBySuffix[row.id] = [];
          allRowsBySuffix[row.id].push(row);
        }
      });

      // Build user groups
      const groupedByUser = {};
      allRows.forEach(r => {
        if (globalPinnedTags.includes(r.activity.trim().toUpperCase())) return;
        if (/^all[1-4]$/.test(r.id)) return; // skip allX global
        if (!groupedByUser[r.id]) groupedByUser[r.id] = [];
        groupedByUser[r.id].push(r);
      });

      // Append global allX rows to matching users
      for (const userIdKey in groupedByUser) {
        for (const suffixKey in allRowsBySuffix) {
          if (userIdKey.endsWith(suffixKey.replace("all", ""))) {
            groupedByUser[userIdKey] = groupedByUser[userIdKey].concat(allRowsBySuffix[suffixKey]);
          }
        }
      }

      if (isAdmin) {
        // Show all users in master dropdowns
        const usersSorted = Object.keys(groupedByUser).sort();
        if (usersSorted.length === 0) {
          masterDiv.innerHTML = "<p style='text-align:center;'>No schedule data available.</p>";
          container.innerHTML = "";
          return;
        }
        masterDiv.innerHTML = usersSorted.map(uid => renderDropdown(uid, groupedByUser[uid])).join("");
        container.innerHTML = "<p style='text-align:center;'>Admin Mode: Viewing all users</p>";
      } else {
        // Normal user view: Show only matching user
        if (!userId) {
          container.innerHTML = "<p style='text-align:center; color:red;'>Please enter your User ID.</p>";
          return;
        }
        const matchedKeys = Object.keys(groupedByUser).filter(k => k.includes(userId));
        if (matchedKeys.length === 0) {
          container.innerHTML = `<p style='text-align:center; color:red;'>No schedule found for user ID: ${userId}</p>`;
          return;
        }
        const userKey = matchedKeys[0];
        container.innerHTML = renderDropdown(userKey, groupedByUser[userKey]);
        masterDiv.innerHTML = "";
      }
    }

    // Filter dropdowns on master search
    function filterMasterDropdowns() {
      const filter = document.getElementById("masterSearch").value.toLowerCase();
      const masterDiv = document.getElementById("masterSchedule");
      const userSections = masterDiv.querySelectorAll(".user-section");
      userSections.forEach(section => {
        const header = section.querySelector(".dropdown-label").textContent.toLowerCase();
        if (header.includes(filter)) {
          section.style.display = "block";
        } else {
          section.style.display = "none";
        }
      });
    }

    // Initial setup: hide admin controls
    document.getElementById("masterPasswordContainer").style.display = "none";
    document.getElementById("masterSearchContainer").style.display = "none";
    document.getElementById("exitAdminBtn").style.display = "none";
  </script>
</body>
</html>
