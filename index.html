<!DOCTYPE html>
<html>
<head>
  <title>VCU Schedule Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #F7F7F7;
      padding: 20px;
      color: #231F20;
    }
    h1 {
      color: #F0B323;
      text-align: center;
    }
    .input-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      justify-content: center;
      flex-direction: column;
      align-items: center;
    }
    input, button {
      padding: 10px;
      font-size: 1em;
    }
    .card {
      border: 2px solid #F0B323;
      border-radius: 10px;
      padding: 15px;
      background: #fff;
      flex: 1 1 300px;
      box-sizing: border-box;
      position: relative;
      transition: background-color 0.3s, box-shadow 0.3s, border-color 0.3s;
    }
    .card.top-row {
      border-color: #D9A600;
      background-color: #FFF3B0;
    }
    .card.global-top {
      border-color: #D9A600;
      background-color: #FFF3B0;
    }
    .card.shared-pinned {
      border-color: #D9A600;
      background-color: #FFF3B0;
    }
    /* Announcement box — slightly darker warm yellow */
    .card.global-top.announcement-row {
      border-color: #D9A600;
      background-color: #FFF3B0;
    }
    .card strong {
      display: block;
      font-size: 1.1em;
      margin-bottom: 5px;
      color: #00558C;
    }
    .card .activity-text {
      font-size: 1.0em;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .card .location-text {
      font-size: 0.8em;
      font-style: italic;
      color: #444;
    }
    .card.yellow-highlight {
      border-color: #F0B323;
      background-color: #FFF8E1;
      box-shadow: 0 0 8px rgba(240, 179, 35, 0.5);
    }
    .card.red-highlight {
      border-color: #D72631;
      background-color: #FFE6E8;
      box-shadow: 0 0 8px rgba(215, 38, 49, 0.6);
    }
    .card.red-highlight .now-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #D72631;
      color: #fff;
      font-size: 0.7em;
      padding: 2px 6px;
      border-radius: 5px;
      font-weight: bold;
      user-select: none;
    }
    #vcu-logo {
      display: block;
      margin: 0 auto 20px;
      max-width: 150px;
    }
    .dropdown-label, .group-label {
      cursor: pointer;
      font-weight: bold;
      padding: 10px;
      background-color: #F0B323;
      color: #fff;
      border-radius: 8px;
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      transition: background-color 0.3s;
    }
    .dropdown-label:hover, .group-label:hover {
      background-color: #e09f1e;
    }
    .dropdown-content, .group-content {
      display: none;
      padding: 10px;
      border: 1px solid #F0B323;
      border-radius: 8px;
      background: #fff;
      margin-bottom: 20px;
    }
    .arrow {
      display: inline-block;
      transition: transform 0.2s;
    }
    #masterPasswordContainer,
    #masterSearchContainer,
    #exitAdminBtn {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: all 0.3s ease;
      text-align: center;
      margin-bottom: 10px;
    }
    #masterPasswordContainer.show,
    #masterSearchContainer.show,
    #exitAdminBtn.show {
      max-height: 100px;
      opacity: 1;
    }
    .user-section, .group-section {
      margin-bottom: 10px;
    }
    .section-header {
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      margin-top: 40px;
      color: #00558C;
    }
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }
    .pinned-rows {
      margin-bottom: 15px;
    }
    .global-tag-section {
      margin-bottom: 30px;
      border: 2px solid #D72631;
      border-radius: 10px;
      padding: 15px;
      background: #FFF4F5;
    }
  </style>
</head>
<body>
  <img src="https://cumulusassociation.org/wp-content/uploads/2021/10/VCU-Logo-Seal-Virginia-Commonwealth-University1.png" id="vcu-logo" alt="VCU Logo" />
  <h1>Orientation Grids Viewer</h1>

  <div class="input-group">
    <input type="text" id="userId" placeholder="Enter your ID" />
    <button onclick="loadSchedule()">View Schedule</button>
  </div>

  <div class="input-group">
    <div class="collapsible-label" onclick="togglePassword()">
      <span id="arrow">▸</span> Show Master Schedule Access
    </div>
  </div>

  <div id="masterPasswordContainer">
    <input type="password" id="masterPassword" placeholder="Enter master password" />
  </div>

  <div id="masterSearchContainer">
    <input type="text" id="masterSearch" placeholder="Search by any keyword..." />
    <button id="masterSearchBtn">Search</button>
  </div>

  <div id="exitAdminBtn">
    <button onclick="exitAdminMode()">Exit Admin Mode</button>
  </div>

  <div id="scheduleContainer"></div>
  <div id="masterSchedule"></div>

  <script>
    const SHEET_ID = "1Uafwo7ikADBeXOnof6Fq1LSKXVWfP9kJDMWsg2VirWE";
    const allTabs = ["6/23-24", "6/26-27", "6/30", "7/7-8", "7/10-11", "7/14-15", "7/17-18", "7/21-22", "7/24", "8/15", "Transfer Session"];
    const sessionDateMap = {
      "2025-06-23": "6/23-24", "2025-06-24": "6/23-24",
      "2025-06-25": "6/26-27", "2025-06-26": "6/26-27", "2025-06-27": "6/26-27",
      "2025-06-29": "6/30", "2025-06-30": "6/30",
      "2025-07-03": "7/7-8", "2025-07-04": "7/7-8", "2025-07-05": "7/7-8", "2025-07-06": "7/7-8", "2025-07-07": "7/7-8", "2025-07-08": "7/7-8",
      "2025-07-09": "7/10-11", "2025-07-10": "7/10-11", "2025-07-11": "7/10-11",
      "2025-07-14": "7/14-15", "2025-07-15": "7/14-15",
      "2025-07-17": "7/17-18", "2025-07-18": "7/17-18",
      "2025-07-21": "7/21-22", "2025-07-22": "7/21-22",
      "2025-07-24": "7/24", "2025-08-15": "8/15"
    };
    const MASTER_PASSWORD = "master123";
    let isAdmin = false;
    let autoRefreshInterval = null;

    // Custom user display names mapping
    const userNameMap = {
      "abc1": "Alex B.",
      "sara2": "Sara J.",
      "famx3": "Family - Johnson",
      "doe4": "Family - Doe"
      // Add more mappings here
    };

    document.getElementById("userId").addEventListener("keydown", e => { if (e.key === "Enter") loadSchedule(); });
    document.getElementById("masterPassword").addEventListener("keydown", e => { if (e.key === "Enter") loadSchedule(); });
    document.getElementById("masterSearchBtn").addEventListener("click", filterMasterDropdowns);
    document.getElementById("masterSearch").addEventListener("keydown", e => { if (e.key === "Enter") filterMasterDropdowns(); });

    function togglePassword() {
      const container = document.getElementById("masterPasswordContainer");
      const arrow = document.getElementById("arrow");
      const passwordInput = document.getElementById("masterPassword");

      const isOpen = container.classList.contains("show");

      if (isOpen) {
        container.classList.remove("show");
        arrow.textContent = "▸";
      } else {
        container.classList.add("show");
        arrow.textContent = "▾";
        setTimeout(() => passwordInput.focus(), 300);
      }
    }

    function exitAdminMode() {
      isAdmin = false;
      clearInterval(autoRefreshInterval);
      document.getElementById("masterSearchContainer").classList.remove("show");
      document.getElementById("exitAdminBtn").classList.remove("show");
      document.getElementById("masterPassword").value = "";
      document.getElementById("masterSchedule").innerHTML = "";
      document.getElementById("scheduleContainer").innerHTML = "";
      document.getElementById("userId").value = "";
    }

    function getTodayDateString() {
      return new Date().toISOString().split("T")[0];
    }

    function getTodayTabs() {
      const session = sessionDateMap[getTodayDateString()];
      return session ? allTabs.filter(tab => tab === session) : [];
    }

    function extractLink(text) {
      if (!text) return "";
      const hyperlinkFormulaRegex = /^=HYPERLINK\("([^"]+)","([^"]+)"\)$/i;
      const match = text.match(hyperlinkFormulaRegex);
      if (match) return `<a href="${match[1]}" target="_blank" rel="noopener noreferrer">${match[2]}</a>`;
      if (/^(https?:\/\/)/i.test(text)) return `<a href="${text}" target="_blank" rel="noopener noreferrer">${text}</a>`;
      return text;
    }

    function parseTimeString(timeStr) {
      const now = new Date();
      const todayStr = now.toDateString();
      try {
        return new Date(`${todayStr} ${timeStr.trim()}`);
      } catch {
        return null;
      }
    }

    function parseEventTimes(timeStr) {
      if (!timeStr) return null;
      const parts = timeStr.split("-");
      const now = new Date();
      const todayStr = now.toDateString();

      if (parts.length === 2) {
        const start = parseTimeString(parts[0]);
        const end = parseTimeString(parts[1]);
        if (start && end) return { start, end };
      } else if (parts.length === 1) {
        const start = parseTimeString(parts[0]);
        if (start) return { start, end: null };
      }
      return null;
    }

    function getHighlightClass(event, nextEvent) {
      const now = new Date();
      const FIVE_MINUTES = 5 * 60 * 1000;

      if (!event.times) return "";

      const yellowStart = new Date(event.times.start.getTime() - FIVE_MINUTES);
      const start = event.times.start;
      const end = event.times.end;

      let redHighlightEnd = null;
      if (end) {
        redHighlightEnd = end;
      } else if (nextEvent && nextEvent.times) {
        redHighlightEnd = nextEvent.times.start;
      }

      if (now >= yellowStart && now < start) return "yellow-highlight";
      if (now >= start && (!redHighlightEnd || now < redHighlightEnd)) return "red-highlight";

      return "";
    }

    function createCardHTML(item, highlightClass) {
      const globalTags = ["TOP", "ANNOUNCEMENT"];
      const locationTag = item.location.trim().toUpperCase();
      let styleClass = "";
      if (globalTags.includes(locationTag)) {
        styleClass = "global-top";
      } else if (item.id.startsWith("all")) {
        styleClass = "shared-pinned";
      }

      return `
        <div class="card ${styleClass} ${highlightClass}">
          ${highlightClass === "red-highlight" ? '<div class="now-badge">Happening now</div>' : ""}
          <strong>${item.time}</strong>
          <div class="activity-text">${extractLink(item.activity)}</div>
          <div class="location-text">${extractLink(item.location)}</div>
          <small style="color:gray;">User ID: ${item.id}</small>
        </div>`;
    }

    const renderDropdown = (userId, rows) => {
      const globalTags = ["TOP", "ANNOUNCEMENT"]; // Add any other pinned tags here
      const displayName = userNameMap[userId] || userId.replace(/\d$/, '');

      // Separate pinned rows and normal rows
      const pinnedRows = rows.filter(r => globalTags.includes(r.location.trim().toUpperCase()));
      const normalRows = rows.filter(r => !globalTags.includes(r.location.trim().toUpperCase()));

      // Parse times for normal rows for sorting and highlighting
      normalRows.forEach(r => r.times = parseEventTimes(r.time));
      normalRows.sort((a, b) => {
        if (!a.times || !b.times) return 0;
        return a.times.start - b.times.start;
      });

      // Create HTML for pinned and normal rows
      const pinnedHTML = pinnedRows.length ? `
        <div class="pinned-rows">
          ${pinnedRows.map(r => createCardHTML(r, "")).join('')}
        </div>` : "";

      const normalHTML = normalRows.map((r, i) => {
        const next = normalRows[i + 1];
        const highlightClass = getHighlightClass(r, next);
        return createCardHTML(r, highlightClass);
      }).join("");

      if (isAdmin) {
        // Admin mode: show dropdown toggle as before
        return `
          <div class="user-section">
            <div class="dropdown-label" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block';">
              ${displayName} <span class="arrow">▾</span>
            </div>
            <div class="dropdown-content" style="display:none;">
              ${pinnedHTML}
              <div class="schedule-grid">
                ${normalHTML}
              </div>
            </div>
          </div>`;
      } else {
        // User mode: show all expanded, no dropdown
        return `
          <div class="user-section">
            <strong>${displayName}</strong>
            ${pinnedHTML}
            <div class="schedule-grid">
              ${normalHTML}
            </div>
          </div>`;
      }
    };

    // Group labels mapping suffix to group name
    const groupLabels = {
      "1": "Day 1",
      "2": "Day 2",
      "3": "Families Day 1",
      "4": "Families Day 2"
    };

    // Render group of users with collapsible container
    function renderGroup(groupKey, users, allRowsBySuffix, globalPinnedRows) {
      // users is an array of userId strings belonging to this group
      const userSectionsHTML = users.map(uid => {
        // For each user, combine user's rows + shared allX rows for suffix
        let combinedRows = usersRowsMap[uid] || [];
        return renderDropdown(uid, combinedRows);
      }).join("");

      return `
        <div class="group-section">
          <div class="group-label" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block';">
            ${groupLabels[groupKey] || "Group " + groupKey} <span class="arrow">▾</span>
          </div>
          <div class="group-content" style="display:none;">
            <div class="global-tag-section">
              ${globalPinnedRows.map(row => createCardHTML(row, "")).join("")}
            </div>
            ${userSectionsHTML}
          </div>
        </div>
      `;
    }

    let usersRowsMap = {}; // global to hold groupedByUser for renderGroup

    async function loadSchedule() {
      const userIdInput = document.getElementById("userId").value.trim().toLowerCase();
      const password = document.getElementById("masterPassword").value.trim();
      const container = document.getElementById("scheduleContainer");
      const masterDiv = document.getElementById("masterSchedule");
      container.innerHTML = "Loading...";
      masterDiv.innerHTML = "";

      const SHEET_TABS = getTodayTabs();
      if (!SHEET_TABS.length) {
        container.innerHTML = "<p style='text-align:center; color:red;'>No session data available for today.</p>";
        return;
      }

      if (password === MASTER_PASSWORD) {
        isAdmin = true;
        document.getElementById("masterSearchContainer").classList.add("show");
        document.getElementById("exitAdminBtn").classList.add("show");
      } else if (password) {
        alert("Incorrect master password.");
        return;
      } else {
        isAdmin = false;
        document.getElementById("masterSearchContainer").classList.remove("show");
        document.getElementById("exitAdminBtn").classList.remove("show");
      }

      // Fetch all sheets in parallel and combine rows
      const fetchPromises = SHEET_TABS.map(tab =>
        fetch(`https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(tab)}`).then(res => res.json())
      );

      const sheetsData = await Promise.all(fetchPromises);
      let combinedRows = [];
      sheetsData.forEach(sheet => combinedRows.push(...sheet));

      // Clean empty rows (no ID or no activity)
      combinedRows = combinedRows.filter(r => r.id && r.activity);

      // Build grouped by user ID
      usersRowsMap = {};
      combinedRows.forEach(row => {
        const uid = row.id.trim().toLowerCase();
        if (!usersRowsMap[uid]) usersRowsMap[uid] = [];
        usersRowsMap[uid].push(row);
      });

      if (!isAdmin) {
        // Normal user view
        if (!usersRowsMap[userIdInput]) {
          container.innerHTML = `<p style='text-align:center; color:red;'>User ID not found.</p>`;
          return;
        }
        container.innerHTML = renderDropdown(userIdInput, usersRowsMap[userIdInput]);
      } else {
        // Admin mode, show all users grouped by suffix

        // Collect global pinned rows (location = TOP or ANNOUNCEMENT)
        const globalPinnedRows = combinedRows.filter(r => {
          const loc = r.location.trim().toUpperCase();
          return loc === "TOP" || loc === "ANNOUNCEMENT";
        });

        // Group users by last char suffix
        let groups = {};
        Object.keys(usersRowsMap).forEach(uid => {
          const suffix = uid.slice(-1);
          if (!groups[suffix]) groups[suffix] = [];
          groups[suffix].push(uid);
        });

        // Build HTML with groups collapsible
        let html = "";
        Object.entries(groups).forEach(([groupKey, userIds]) => {
          html += renderGroup(groupKey, userIds, usersRowsMap, globalPinnedRows);
        });

        masterDiv.innerHTML = html;

        // Show master search container and exit admin button
        document.getElementById("masterSearchContainer").classList.add("show");
        document.getElementById("exitAdminBtn").classList.add("show");

        container.innerHTML = "<p style='text-align:center;'>Admin view - all users shown below.</p>";
      }
    }

    // Filter master dropdowns by search input (admin only)
    function filterMasterDropdowns() {
      const query = document.getElementById("masterSearch").value.trim().toLowerCase();
      if (!query) {
        // Show all groups and users
        const groups = document.querySelectorAll(".group-section");
        groups.forEach(g => g.style.display = "");
        const userSections = document.querySelectorAll(".user-section");
        userSections.forEach(u => u.style.display = "");
        return;
      }

      const groups = document.querySelectorAll(".group-section");
      groups.forEach(group => {
        let groupMatches = false;
        const users = group.querySelectorAll(".user-section");
        users.forEach(userSection => {
          const text = userSection.textContent.toLowerCase();
          if (text.includes(query)) {
            userSection.style.display = "";
            groupMatches = true;
          } else {
            userSection.style.display = "none";
          }
        });
        group.style.display = groupMatches ? "" : "none";
      });
    }
  </script>
</body>
</html>
